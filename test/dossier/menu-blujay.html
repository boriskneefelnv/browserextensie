<!doctype html>
<html><head><meta charset="utf-8"></head><body style="font:13px monospace">
<p>Warehouse menu (zoals BluJay: toetsen komen binnen in een onzichtbaar tussenvakje)</p>
<div style="position:absolute;bottom:20px;left:10px"><span>Uw keuze &nbsp;:</span>
  <div id="box" style="display:inline-block;width:60px;height:14px;border:1px solid #889;vertical-align:middle">ts4117</div>
</div>
<textarea id="tv" style="position:absolute;left:5px;top:5px;width:1px;height:1px;border:0;padding:0"></textarea>
<script>
  const tv = document.getElementById('tv');
  const box = document.getElementById('box');
  let eerste = true;
  tv.focus();
  tv.addEventListener('input', () => {
    // BluJay zet de getypte tekens in het actieve vak en maakt het tussenvakje weer leeg
    box.textContent = (eerste ? '' : box.textContent) + tv.value;
    eerste = false;
    tv.value = '';
  });
  tv.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      if (box.textContent.trim().toLowerCase() === 'cq0579') setTimeout(() => (location.href = 'cq0579.html'), 300);
    }
  });
</script>
</body></html>

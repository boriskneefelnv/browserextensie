<!doctype html><html><head><meta charset="utf-8"><style>body{font:12px monospace;margin:30px} .r{margin:2px 0} input.l{background:#fff;border:1px solid #9ab;width:180px} .gap{height:12px}</style></head><body>
<div class="r"><input class="l" readonly tabindex="-1" value="1  van_activiteit :"> <input class="v" data-nr="1" value="5"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="2  t/m_activiteit :"> <input class="v" data-nr="2" value="6"></div>

<div class="r"><input class="l" readonly tabindex="-1" value="4  t/m_omzetcode :"> <input class="v" data-nr="4" value="8"></div>
<div class="gap"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="5  van_afdeling :"> <input class="v" data-nr="5" value="XX"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="6  t/m_afdeling :"> <input class="v" data-nr="6" value="XX"></div>
<div class="gap"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="7  van_periode :"> <input class="v" data-nr="7" value="00/00"></div>

<div class="gap"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="9  van_opdrachtgever :"> <input class="v" data-nr="9" value="OUD"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="10  t/m_opdrachtgever :"> <input class="v" data-nr="10" value="OUD"></div>
<div class="gap"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="11  van_dossiernr :"> <input class="v" data-nr="11" value="5"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="12  t/m_dossiernr :"> <input class="v" data-nr="12" value="5"></div>
<div class="gap"></div>
<div class="r"><input class="l" readonly tabindex="-1" value="13  excel :"> <input class="v" data-nr="13" value="N"></div>
<p id="status"></p>
<div id="prompt" style="display:none;margin-top:20px">Uw keuze &nbsp;: <input id="ok" size="4"><br>( 99/ok = Akkoord, 00 = Afbreken )</div>
<script>
document.querySelector('input.v[data-nr="13"]').addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  setTimeout(() => { document.getElementById("prompt").style.display = "block"; const ok = document.getElementById("ok"); ok.value = "99"; ok.focus(); ok.select(); }, 500);
});
document.getElementById("ok").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("status").textContent = e.target.value === "99" ? "Klaar" : "Afgebroken";
});
</script></body></html>

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>BluJay Assistent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="20" height="20" />
    <h1>BluJay Assistent</h1>
    <button id="openOptions" class="icon" title="Handelingen beheren">⚙</button>
  </header>

  <p id="error" class="error" hidden></p>

  <p id="lastRun" class="lastrun" hidden></p>

  <section id="runningBox" hidden>
    <div class="running">
      <span>▶ Bezig: <strong id="runningName"></strong></span>
      <button id="stopRun" class="danger small">Stop</button>
    </div>
    <p id="runningStep" class="progress"></p>
  </section>

  <section>
    <h2>Handelingen voor deze pagina</h2>
    <div id="macroList"></div>
    <label class="toggle"><input type="checkbox" id="showAll" /> Toon ook handelingen voor andere pagina's</label>
  </section>

  <section id="recordSection">
    <h2>Opnemen</h2>
    <div id="recIdle">
      <p class="hint">Neem een vaste handeling op door hem één keer zelf uit te voeren in BluJay.</p>
      <button id="startRec" class="rec">● Nieuwe handeling opnemen</button>
    </div>
    <div id="recActive" hidden>
      <p><span class="dot"></span>Opname loopt: <strong id="recCount">0</strong> stap(pen)</p>
      <input id="recName" type="text" placeholder="Naam van de handeling" />
      <div class="row">
        <button id="saveRec" class="primary">Stoppen &amp; opslaan</button>
        <button id="cancelRec">Annuleren</button>
      </div>
    </div>
    <p id="recElsewhere" class="hint" hidden>Er loopt een opname in een ander tabblad.</p>
  </section>

  <section>
    <h2>Hulpmiddelen</h2>
    <button id="pick">🎯 Element kiezen (selector kopiëren)</button>
    <div id="picked" class="picked" hidden></div>
  </section>

  <script src="../shared.js"></script>
  <script src="../pdftext.js"></script>
  <script src="../parsers.js"></script>
  <script src="popup.js"></script>
</body>
</html>

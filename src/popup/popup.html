<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Neele-Vat BluJay Assistent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="appbar">
    <span class="appname">Neele-Vat BluJay Assistent</span>
    <button id="openOptions" class="appbar-btn" title="Acties beheren">Beheer</button>
  </header>

  <div id="error" class="msg fail" hidden><span class="msg-text"></span><button class="msg-close" title="Melding sluiten" aria-label="Melding sluiten">×</button></div>
  <div id="lastRun" class="msg" hidden><span class="msg-text"></span><button class="msg-close" title="Melding sluiten" aria-label="Melding sluiten">×</button></div>
  <div id="traceBar" class="tracebar" hidden><button id="copyTrace" class="bj-btn">📋 Details kopiëren</button><span id="copied"></span></div>

  <div id="runningBox" class="box running" hidden>
    <div class="box-title">Bezig: <span id="runningName"></span></div>
    <div class="box-body">
      <p id="runningStep" class="progress"></p>
      <button id="stopRun" class="bj-btn danger">■ Stop</button>
    </div>
  </div>

  <div id="recActive" class="box rec" hidden>
    <div class="box-title"><span class="dot"></span>Opname loopt — <span id="recCount">0</span> stap(pen)</div>
    <div class="box-body">
      <input id="recName" type="text" placeholder="Naam van de nieuwe actie" />
      <div class="row">
        <button id="saveRec" class="bj-btn primary">Stoppen &amp; opslaan</button>
        <button id="cancelRec" class="bj-btn">Annuleren</button>
      </div>
    </div>
  </div>

  <!-- Overzicht -->
  <main id="overview">
    <div class="menu-head">Acties</div>
    <nav id="macroList" class="menu"></nav>
    <label class="toggle"><input type="checkbox" id="showAll" /> Ook acties voor andere pagina's tonen</label>

    <details class="extra">
      <summary class="menu-head small">Extra</summary>
      <nav class="menu">
        <a id="startRec" class="item"><span class="bullet red"></span>Nieuwe actie opnemen</a>
        <a id="pick" class="item"><span class="bullet"></span>Element kiezen (selector kopiëren)</a>
        <a id="openOptions2" class="item"><span class="bullet"></span>Acties beheren en bewerken</a>
      </nav>
      <p id="recElsewhere" class="hint" hidden>Er loopt een opname in een ander tabblad.</p>
      <div id="picked" class="picked" hidden></div>
    </details>
  </main>

  <!-- Detail van één actie -->
  <main id="detail" hidden></main>

  <script src="../shared.js"></script>
  <script src="../pdftext.js"></script>
  <script src="../parsers.js"></script>
  <script src="popup.js"></script>
</body>
</html>

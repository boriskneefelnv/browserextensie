<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Neele-Vat BluJay Assistent — Acties beheren</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header>
    <img src="../../icons/icon48.png" alt="" width="28" height="28" />
    <h1>Neele-Vat BluJay Assistent — Acties beheren</h1>
    <span id="saved" class="saved"></span>
  </header>
  <div class="layout">
    <aside>
      <button id="newMacro" class="primary wide">+ Nieuwe actie</button>
      <nav id="macroNav"></nav>
      <div class="aside-bottom">
        <button id="navSettings" class="link">⚙ Instellingen</button>
        <button id="navLog" class="link">🧾 Logboek</button>
        <button id="navHelp" class="link">❓ Uitleg</button>
        <hr />
        <button id="importBtn" class="wide">Importeren…</button>
        <button id="exportAll" class="wide">Alles exporteren</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden />
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <template id="helpTpl">
    <h2>Zo werkt het</h2>
    <p>Een <strong>actie</strong> (handeling) is een vaste reeks stappen (klikken, tekst invullen, keuze maken, wachten…) die de extensie voor je uitvoert in BluJay.</p>
    <ol>
      <li><strong>Opnemen:</strong> open BluJay, klik op het extensie-icoon en kies <em>Nieuwe handeling opnemen</em>. Voer de handeling één keer zelf uit en klik daarna op <em>Stoppen &amp; opslaan</em>.</li>
      <li><strong>Variabel maken:</strong> vervang hier vaste waarden door variabelen, bijv. <code>{{ordernummer}}</code>, en voeg bij <em>Invoervelden</em> een veld <code>ordernummer</code> toe. Bij het uitvoeren wordt dan om die waarde gevraagd.</li>
      <li><strong>Uitvoeren:</strong> via het extensie-icoon (sneltoets <kbd>Alt</kbd>+<kbd>B</kbd>), of automatisch via <em>Automatisch starten</em>.</li>
    </ol>
    <h3>Automatisch starten</h3>
    <p>Laat een handeling vanzelf starten als je in BluJay een veld invult/wijzigt (bijv. status wordt <em>Geleverd</em>), of als er een bepaald element verschijnt. De ingevulde waarde is beschikbaar als <code>{{waarde}}</code>.</p>
    <h3>Elementen aanwijzen (selectors)</h3>
    <ul>
      <li><code>#orderNummer</code>, <code>input[name="status"]</code> — gewone CSS-selector</li>
      <li><code>text=Opslaan</code> — knop/link/cel met precies die tekst</li>
      <li><code>label=Ordernummer</code> — invoerveld naast/onder dat label</li>
      <li><code>field=van_periode</code> — eerste invulveld ná die tekst (handig voor schermen zonder echte labels, zoals het selectiescherm van Dossiermutaties)</li>
      <li><code>field=Laaddatum [2]</code> — het 2e invulveld ná die tekst (bijv. de begintijd)</li>
      <li><code>focus</code> — het veld waar de cursor nu staat</li>
      <li><code>xpath=//button[2]</code> — XPath</li>
      <li><code>text=Wijzigen &gt;&gt; 1</code> — het 2e zichtbare element (tellen begint bij 0)</li>
    </ul>
    <p>Tip: gebruik <em>🎯 Element kiezen</em> in de popup om een selector te kopiëren door op het element te klikken.</p>
    <h3>Variabelen</h3>
    <p>Ingebouwd: <code>{{vandaag}}</code>, <code>{{morgen}}</code>, <code>{{gisteren}}</code> (dd-mm-jjjj), <code>{{tijd}}</code>, <code>{{nu}}</code>, <code>{{jaar}}</code>, <code>{{maand}}</code>.
      Opmaak met <code>|</code>: <code>{{van|JJ/MM}}</code> → 26/01, <code>{{van|MM-JJJJ}}</code> → 01-2026, <code>{{klant|hoofdletters}}</code>. Met de stap <em>Lees waarde</em> kun je een waarde van de pagina bewaren en later weer gebruiken.</p>
    <h3>Alleen als…</h3>
    <p>Bij elke stap kun je een voorwaarde zetten, bijv. <code>{{status}} == Gepland</code>, <code>{{klant}} != </code>, <code>{{opmerking}} ~ spoed</code> (bevat). Combineer met de stap <em>Stop handeling</em> om af te breken.
      Met <code>bestaat: text=Uitslagorders</code> of <code>!bestaat: text=Uitslagorders</code> voer je een stap alleen uit als een element wel/niet op het scherm staat.</p>
  </template>

  <script src="../shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
